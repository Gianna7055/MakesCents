      type: System.Threading.Tasks.Task{MakesCentsBackend.Models.GetEnvelopeFundingQueueResponse}
      description: ''
    content.vb: Public Function SetEnvelopeFundingQueueAsync(fundingQueue As SetEnvelopeFundingQueueRequest) As Task(Of GetEnvelopeFundingQueueResponse)
